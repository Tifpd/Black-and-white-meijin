name: PlayOK Scraper

on:
  schedule:
    # 21:00 UTC = 23:00 v létě (CEST)
    # 22:00 UTC = 23:00 v zimě (CET)
    - cron: '0 21 * * 5'
    - cron: '0 22 * * 5'
  workflow_dispatch: # Ponechává možnost spustit scraper kdykoliv ručně tlačítkem

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # POJISTKA NA LETNÍ/ZIMNÍ ČAS:
      # Pokud jde o plánovaný běh (schedule), ověříme, zda je v Praze přesně 23:00.
      # Pokud ne, skript se během 2 sekund úspěšně ukončí, aniž by dělal zbytečnou práci.
      - name: Check if it is 23:00 Prague time
        if: github.event_name == 'schedule'
        run: |
          PRAGUE_HOUR=$(TZ="Europe/Prague" date +%H)
          echo "Current hour in Prague is: $PRAGUE_HOUR"
          if [ "$PRAGUE_HOUR" != "23" ]; then
            echo "It is not 23:00 in Prague. Skipping run."
            exit 0
          fi

      - name: Install dependencies
        run: npm install

      - name: Run Scraper
        run: node scraper.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Automatické uložení nově vygenerovaných dat zpět do tvého data.json na GitHubu
      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Auto-update standings"
          git push
